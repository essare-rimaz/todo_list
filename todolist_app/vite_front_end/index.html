<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

    <title>canvas_js</title>
  </head>
  <body>
    <div class="p-4 container">
      <div class="row">
    </div>
    <div class="p-4 container">
      <div class="row">
        <div class="col"></div>
          <div class="col">
            <form class="form">
              <div class="y3">
                  <input type="username" name="email" class="m1 form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Enter email">
              </div>
              <div>
                  <input type="password" name="password" class="m3 form-control" id="exampleInputPassword1" placeholder="Password">
              </div>    
                  <button type="submit" class="btn btn-primary">Login</button>
            </form>
          </div>
        <div class="col"></div>
      </div>
    </div>
    <script type="module">
      import Cookies from 'js-cookie';

      const formEl = document.querySelector('form');

      formEl.addEventListener('submit', event => {
        event.preventDefault();
        
        const email = document.getElementById('exampleInputEmail1').value;
        const password = document.getElementById('exampleInputPassword1').value;

        const formData = new FormData();
        formData.append("username", email)
        formData.append("password", password)

        const data = Object.fromEntries(formData);

        async function foo(data) {
          const res = await fetch("http://127.0.0.1:8000/token", {
          method: 'POST',
          //headers: { 'content-type': 'application/x-www-form-urlencoded' },
          body: data
          });
          const response = await res.json();
          const jwt_token = await response.access_token;
          Cookies.set('my_access_token', jwt_token)
          let cookie = Cookies.get('my_access_token');
        }
            // Make the API call
        foo(formData)
      });
    </script>

    <button id="myButton">Click Me</button>
    <button id="myAPIButton">Click Me</button>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
